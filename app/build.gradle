plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suivipredication.app'
    compileSdk 35

    signingConfigs {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                storeFile file(project.property("RELEASE_STORE_FILE"))
                storePassword project.property("RELEASE_STORE_PASSWORD")
                keyAlias project.property("RELEASE_KEY_ALIAS")
                keyPassword project.property("RELEASE_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId 'com.suivipredication.app'
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName '1.8.6'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
}
